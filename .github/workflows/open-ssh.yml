name: open-ssh

on:
  workflow_dispatch:
    inputs:
      my_ip:
        description: "내 IP (Mac 터미널에서 curl -s https://checkip.amazonaws.com)"
        required: true

jobs:
  open-ssh:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: 내 IP SSH 허용
        run: |
          aws ec2 authorize-security-group-ingress --group-id ${{ secrets.EC2_SG_ID }} \
            --protocol tcp --port 22 --cidr ${{ inputs.my_ip }}/32 || echo "이미 허용돼 있음"
