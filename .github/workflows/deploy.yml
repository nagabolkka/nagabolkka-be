# main 브랜치에 push(PR 머지)되면 EC2 서버에 자동 배포

name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # 배포가 겹치면 앞의 배포가 끝날 때까지 대기

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: GitHub 서버 IP 확인
        id: ip
        run: echo "ip=$(curl -fsS https://checkip.amazonaws.com)" >> "$GITHUB_OUTPUT"

      - name: AWS 로그인
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: 보안 그룹에 SSH 임시 허용
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32"

      - name: 서버에서 최신 코드 받고 재시작
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -e
            cd ~/nagabolkka-be
            git fetch origin main
            git checkout main
            git reset --hard origin/main   # 서버 코드를 main과 똑같이 맞춤 (.env는 git 밖이라 유지)
            docker compose up -d --build
            docker image prune -f

      - name: 헬스 체크 (최대 2분 대기)
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://api.nagabolkka.shop/api/health; then
              echo; echo "배포 성공"; exit 0
            fi
            sleep 6
          done
          echo "헬스 체크 실패: 서버에서 docker compose logs app 확인"
          exit 1

      - name: 보안 그룹 SSH 임시 허용 제거
        if: always()   # 앞 단계가 실패해도 항상 실행
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.EC2_SG_ID }}" \
            --protocol tcp --port 22 \
            --cidr "${{ steps.ip.outputs.ip }}/32" || true
