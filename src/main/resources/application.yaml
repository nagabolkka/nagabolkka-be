spring:
  application:
    name: nagabolkka-backend

  config:
    import: optional:file:.env[.properties]

  # 개발 초반에는 H2(메모리 DB) 사용 → M1에서 MySQL로 교체
  datasource:
    url: jdbc:h2:mem:nagabolkka
    username: sa
    password:

  h2:
    console:
      enabled: true

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}

  # 카카오 디벨로퍼스에도 같은 값 등록
  allowed-redirect-uris:
    - http://localhost:5173/oauth/kakao
    - https://nagabolkka.netlify.app/oauth/kakao
jwt:
  # 운영은 application-prod.yaml 에서 JWT_SECRET 필수
  secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789}
  access-token-expiration: 7d
kma:
  service-key: ${KMA_SERVICE_KEY:}
openai:
  api-key: ${OPENAI_API_KEY:}
cors:
  allowed-origins: http://localhost:5173