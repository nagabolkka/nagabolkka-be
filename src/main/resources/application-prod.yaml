spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 20
      min-spare: 2

cors:
  allowed-origins: https://nagabolkka.vercel.app

jwt:
  # 기본값 없음 → 서버 .env 에 JWT_SECRET 이 없으면 앱이 뜨지 않는다
  secret: ${JWT_SECRET}

crypto:
  # 기본값 없음 → 서버 .env 에 없으면 앱이 뜨지 않는다
  hash-secret: ${HASH_SECRET}
  aes-key: ${AES_KEY}

push:
  firebase-credentials: ${FIREBASE_CREDENTIALS_BASE64:}   # 서비스 계정 JSON (base64 한 줄)
  app-url: ${APP_URL:http://localhost:5173}                # 알림 누르면 열 주소의 앞부분 (운영 https://nagabolkka.vercel.app)
  quest-cron: "0 0 9 * * *"                                # 매일 09:00 KST