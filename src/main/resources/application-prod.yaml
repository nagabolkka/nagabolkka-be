spring:
  datasource:
    url: jdbc:mysql://mysql:3306/${DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  forward-headers-strategy: framework

cors:
  allowed-origins: https://nagabolkka.netlify.app

jwt:
  # 기본값 없음 → 서버 .env 에 JWT_SECRET 이 없으면 앱이 뜨지 않는다
  secret: ${JWT_SECRET}