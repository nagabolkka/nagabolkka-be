# 운영 서버(EC2)에서 실행: docker compose up -d --build
# 필요한 값은 같은 폴더의 .env 파일에서 읽어옴 (.env.example 참고)

services:
  mysql:
    image: mysql:8.4
    container_name: nagabolkka-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    # 메모리 1GB 서버용 절약 설정
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=64M
      - --max-connections=30
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql   # 컨테이너를 지워도 데이터는 남음
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # 포트를 외부에 열지 않음 (app 컨테이너만 접근)

  app:
    build: .
    container_name: nagabolkka-app
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_OPTS: "-Xms128m -Xmx384m"
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    # 8080도 외부에 열지 않음 → caddy를 통해서만 접근

  caddy:
    image: caddy:2
    container_name: nagabolkka-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # HTTPS 인증서 저장
      - caddy-config:/config
    depends_on:
      - app

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
